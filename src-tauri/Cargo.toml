[package]
name = "genjiball-host-tool"
version = "0.1.0"
description = "Genji Ball Ranked host tool"
authors = ["Genji Ball Team"]
repository = "https://github.com/Genji-Ball-Team/genjiball-host-tool"
edition = "2021"
publish = false

[lib]
# The `_lib` suffix keeps the lib name apart from the bin name (a Windows clash: rust-lang/cargo#8519).
name = "genjiball_host_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
dirs = "7.0.0"
tauri-plugin-dialog = "2.8.1"
keyring = { version = "3", default-features = false, features = ["windows-native"] }
url = "2"

# Small release binary: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
